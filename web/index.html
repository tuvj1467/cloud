<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云存储服务</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="auth-page" class="page">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>☁️ 云存储</h1>
                    <p>安全可靠的文件存储服务</p>
                </div>
                
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('login')">登录</button>
                    <button class="tab" onclick="switchTab('register')">注册</button>
                </div>

                <div id="login-form" class="form-panel">
                    <div class="form-group">
                        <label>账号</label>
                        <input type="text" id="login-account" placeholder="用户名/手机号/邮箱">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" placeholder="密码">
                    </div>
                    <button class="btn btn-primary" onclick="login()">登录</button>
                    <div class="form-links">
                        <a href="#" onclick="showResetPassword()">忘记密码？</a>
                    </div>
                </div>

                <div id="register-form" class="form-panel hidden">
                    <div class="form-group">
                        <label>注册方式</label>
                        <div class="radio-group">
                            <label><input type="radio" name="register-type" value="name" checked> 用户名</label>
                            <label><input type="radio" name="register-type" value="phone"> 手机号</label>
                            <label><input type="radio" name="register-type" value="email"> 邮箱</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>账号</label>
                        <input type="text" id="register-account" placeholder="用户名/手机号/邮箱">
                    </div>
                    <div class="form-group" id="register-name-group">
                        <label>显示名称</label>
                        <input type="text" id="register-name" placeholder="显示名称">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="register-password" placeholder="密码（6-20位）">
                    </div>
                    <div class="form-group" id="register-code-group" style="display:none">
                        <div class="code-input">
                            <input type="text" id="register-code" placeholder="验证码">
                            <button class="btn btn-secondary" onclick="sendCode('register')">获取验证码</button>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="register()">注册</button>
                </div>
            </div>
        </div>

        <div id="main-page" class="page hidden">
            <header class="header">
                <div class="logo">☁️ 云存储</div>
                <div class="user-info">
                    <span id="user-name">用户</span>
                    <button class="btn btn-secondary" onclick="logout()">退出</button>
                </div>
            </header>

            <div class="main-content">
                <aside class="sidebar">
                    <div class="nav-item active" onclick="showFiles()">📁 文件管理</div>
                    <div class="nav-item" onclick="showUpload()">⬆️ 上传文件</div>
                    <div class="nav-item" onclick="showBucket()">🪣 桶管理</div>
                </aside>

                <main class="content">
                    <div id="files-panel" class="panel">
                        <div class="panel-header">
                            <h2>文件列表</h2>
                            <button class="btn btn-primary" onclick="showUpload()">上传文件</button>
                        </div>
                        <div id="file-list" class="file-list">
                            <div class="empty-state">暂无文件</div>
                        </div>
                    </div>

                    <div id="upload-panel" class="panel hidden">
                        <div class="panel-header">
                            <h2>上传文件</h2>
                        </div>
                        <div class="upload-area" id="upload-area" ondrop="handleDrop(event)" ondragover="handleDragOver(event)">
                            <div class="upload-icon">📁</div>
                            <p>拖拽文件到此处上传</p>
                            <p>或</p>
                            <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">选择文件</button>
                            <input type="file" id="file-input" multiple style="display:none" onchange="handleFileSelect(event)">
                        </div>
                        <div id="upload-progress" class="progress-container hidden">
                            <div class="progress-bar"></div>
                            <span class="progress-text">0%</span>
                        </div>
                    </div>

                    <div id="bucket-panel" class="panel hidden">
                        <div class="panel-header">
                            <h2>桶管理</h2>
                            <button class="btn btn-primary" onclick="createBucket()">创建桶</button>
                        </div>
                        <div id="bucket-list" class="bucket-list">
                            <div class="empty-state">暂无桶</div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <div id="reset-password-modal" class="modal hidden">
            <div class="modal-content">
                <h3>重置密码</h3>
                <div class="form-group">
                    <label>手机号/邮箱</label>
                    <input type="text" id="reset-contact" placeholder="手机号或邮箱">
                </div>
                <div class="form-group">
                    <div class="code-input">
                        <input type="text" id="reset-code" placeholder="验证码">
                        <button class="btn btn-secondary" onclick="sendCode('reset')">获取验证码</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="reset-password" placeholder="新密码">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="resetPassword()">确认重置</button>
                </div>
            </div>
        </div>

        <div id="create-bucket-modal" class="modal hidden">
            <div class="modal-content">
                <h3>创建桶</h3>
                <div class="form-group">
                    <label>桶名称</label>
                    <input type="text" id="bucket-name" placeholder="桶名称">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="confirmCreateBucket()">创建</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
