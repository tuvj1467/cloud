syntax = "proto3";

package storage;
option go_package = ".proto/service";
import "validate.proto";


// ==========================================
// 文件核心定义
// ==========================================

// 文件元信息（通用结构，无密码、全脱敏，业务安全）
message FileMeta {
  string file_id = 1;          // 文件唯一ID（雪花ID）
  string name = 2;             // 文件名
  string path = 3;             // 文件存储路径
  int64 size = 4;              // 文件大小（字节）
  string suffix = 5;           // 文件后缀（如：png/pdf/txt）
  string user_id = 6;          // 所属用户ID
  string bucket_id = 7;        // 所属桶ID
  string md5 = 8;              // 文件MD5
  string content_type = 9;     // MIME类型
  string created_at = 10;      // 创建时间
  string updated_at = 11;      // 更新时间
}

// ==========================================
// 1. 获取单个文件信息
// ==========================================
message FileInfoRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}]; // 文件ID必填
}

message FileInfoResponse {
  FileMeta file = 1;
}

// ==========================================
// 2. 上传文件
// ==========================================
message UploadFileRequest {
  string bucket_id = 1 [(validate.rules).string = {min_len: 1}]; // 所属桶ID
  string name = 2 [(validate.rules).string = {min_len:1, max_len:100}]; // 文件名
  string suffix = 3 [(validate.rules).string = {min_len:1}];            // 文件后缀
  int64 size = 4 [(validate.rules).int64 = {gt: 0}];                    // 文件大小必须大于0
  bytes content = 5;                                                    // 文件二进制内容（小文件适用）
  optional string md5 = 6;                                              // 客户端可传MD5触发秒传检查
}

message UploadFileResponse {
  FileMeta file = 1;   // 上传成功返回文件信息
  bool instant = 2;    // true 表示秒传命中（未实际写入物理文件）
}

// ==========================================
// 3. 获取用户文件列表
// ==========================================
message FileListRequest {
  int32 page = 1 [(validate.rules).int32 = {gte: 1}];          // 页码，最小1
  int32 page_size = 2 [(validate.rules).int32 = {gte:1, lte:50}]; // 每页数量 1-50
  string sort_by = 3 [(validate.rules).string = {in: ["name", "size", "create_time", "update_time"]}];
  string sort_order = 4 [(validate.rules).string = {in: ["asc", "desc"]}];
  optional string name_keyword = 5 [(validate.rules).string = {max_len: 50}]; // 文件名模糊搜索（可选）
}

message BucketFileListRequest {
  string bucket_id = 1 [(validate.rules).string.min_len = 1];
  int32 page = 2 [(validate.rules).int32 = {gte: 1}];
  int32 page_size = 3 [(validate.rules).int32 = {gte:1, lte:50}];
  string sort_by = 4 [(validate.rules).string = {in: ["name", "size", "create_time", "update_time"]}];
  string sort_order = 5 [(validate.rules).string = {in: ["asc", "desc"]}];
  optional string name_keyword = 6 [(validate.rules).string = {max_len: 50}]; // 文件名模糊搜索（可选）
}


message FileListResponse {
  repeated FileMeta files = 1; // 文件列表
  int32 total = 2;             // 总数量
}

// ==========================================
// 4. 重命名文件
// ==========================================
message RenameFileRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}];
  string new_name = 2 [(validate.rules).string = {min_len:1, max_len:100}]; // 新文件名
}

message RenameFileResponse {
  bool success = 1;
}

// ==========================================
// 5. 删除文件
// ==========================================
message DeleteFileRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}];
}

message DeleteFileResponse {
  bool success = 1;
}

// ==========================================
// 6. 下载文件
// ==========================================
message DownloadFileRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}];
}

message DownloadFileResponse {
  bytes content = 1; // 文件二进制
  FileMeta file = 2; // 文件信息
}

// ==========================================
// 7. 复制文件
// ==========================================
message CopyFileRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}];           // 源文件ID
  string target_bucket_id = 2 [(validate.rules).string = {min_len: 1}];  // 目标桶ID
  string new_name = 3 [(validate.rules).string = {min_len:1, max_len:100}]; // 新文件名
}

message CopyFileResponse {
  FileMeta file = 1; // 复制后的新文件信息
}

// ==========================================
// 8. 分片上传 - 初始化
// ==========================================
message InitMultipartUploadRequest {
  string bucket_id = 1 [(validate.rules).string = {min_len: 1}];     // 目标桶ID
  string name = 2 [(validate.rules).string = {min_len:1, max_len:100}]; // 文件名
  string suffix = 3 [(validate.rules).string = {min_len:1}];         // 文件后缀
  int64 size = 4 [(validate.rules).int64 = {gt: 0}];                  // 文件总大小
  int32 total_parts = 5 [(validate.rules).int32 = {gte:1, lte:10000}]; // 分片总数
  optional string md5 = 6;                                            // 客户端已知MD5（可选，用于秒传检查）
}

message InitMultipartUploadResponse {
  string upload_id = 1;  // 分片上传唯一标识
  int32 part_size = 2;   // 建议每片大小（字节）
}

// ==========================================
// 9. 分片上传 - 上传单个分片
// ==========================================
message UploadPartRequest {
  string upload_id = 1 [(validate.rules).string = {min_len: 1}]; // 上传ID
  int32 part_number = 2 [(validate.rules).int32 = {gte:1}];      // 分片序号（从1开始）
  bytes content = 3;                                             // 分片二进制内容
  int64 size = 4 [(validate.rules).int64 = {gt: 0}];             // 分片大小
}

message UploadPartResponse {
  bool success = 1;
  string part_md5 = 2;  // 服务端计算的MD5，用于客户端校验
}

// ==========================================
// 10. 分片上传 - 完成合并
// ==========================================
message CompleteMultipartUploadRequest {
  string upload_id = 1 [(validate.rules).string = {min_len: 1}];
}

message CompleteMultipartUploadResponse {
  FileMeta file = 1;     // 合并后的文件信息
  bool instant = 2;      // true 表示秒传命中（合并MD5与已有文件相同）
}

// ==========================================
// 11. 分片上传 - 取消
// ==========================================
message AbortMultipartUploadRequest {
  string upload_id = 1 [(validate.rules).string = {min_len: 1}];
}

message AbortMultipartUploadResponse {
  bool success = 1;
}

// ==========================================
// 12. 文件分享 - 创建
// ==========================================
message CreateShareRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}];
  string permission = 2 [(validate.rules).string = {in: ["read", "download"]}];
  optional int64 expire_seconds = 3;  // 空=永久
  optional int32 max_count = 4;       // 空=不限
}

message CreateShareResponse {
  string share_code = 1;  // 提取码
  string share_url = 2;   // 完整访问URL
}

// ==========================================
// 13. 文件分享 - 访问（匿名）
// ==========================================
message AccessShareRequest {
  string share_code = 1 [(validate.rules).string = {min_len: 1}];
}

message AccessShareResponse {
  FileMeta file = 1;
  string permission = 2;  // read / download
}

// ==========================================
// 14. 分享下载（匿名，校验提取码/有效期/次数）
// ==========================================
message DownloadByShareRequest {
  string share_code = 1 [(validate.rules).string = {min_len: 1}];
}

message DownloadByShareResponse {
  bytes content = 1; // 文件二进制（JSON 下为 base64）
  FileMeta file = 2; // 文件信息
}

// ==========================================
// 15. 用量统计
// ==========================================
message GetStorageStatsRequest {
}

message BucketStats {
  string bucket_id = 1;   // 桶 ID
  string name = 2;        // 桶名
  int64 file_count = 3;   // 桶内文件数
  int64 total_size = 4;   // 桶内文件实际总大小（字节）
  int64 used_size = 5;    // 桶记账已用容量
  int64 size_limit = 6;   // 桶容量上限
}

message StorageStatsResponse {
  int64 file_count = 1;   // 用户文件总数
  int64 total_size = 2;   // 用户文件实际总大小（字节）
  int64 bucket_count = 3; // 桶数量
  repeated BucketStats buckets = 4;
}

// ==========================================
// 16. 预签名下载 URL
// ==========================================
message GetPresignedURLRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}];          // 文件 ID
  optional int64 expire_seconds = 2 [(validate.rules).int64 = {gte: 60, lte: 604800}]; // 有效期（秒），默认 3600
}

message GetPresignedURLResponse {
  string url = 1;       // 预签名下载 URL
  int64 expire_at = 2;  // 过期时间（unix 秒）
}

// ==========================================
// 17. 分享管理（我的分享列表 / 撤销）
// ==========================================
message GetMySharesRequest {
  int32 page = 1 [(validate.rules).int32 = {gte: 1}];
  int32 page_size = 2 [(validate.rules).int32 = {gte:1, lte:50}];
}

message ShareItem {
  string share_code = 1;         // 提取码
  string file_id = 2;            // 文件 ID
  string file_name = 3;          // 文件名（冗余返回，免前端二次查询）
  string permission = 4;         // read / download
  string expire_at = 5;          // 过期时间（空=永久）
  optional int32 max_count = 6;  // 下载次数上限（空=不限）
  int64 used_count = 7;          // 已用下载次数
  string created_at = 8;         // 创建时间
}

message GetMySharesResponse {
  repeated ShareItem shares = 1;
  int32 total = 2;
}

message RevokeShareRequest {
  string share_code = 1 [(validate.rules).string = {min_len: 1}];
}

message RevokeShareResponse {
  bool success = 1;
}

// ==========================================
// 18. 流式下载（server-streaming，大文件分块传输）
// ==========================================
message DownloadChunk {
  bytes data = 1;   // 分块数据
  int64 sent = 2;   // 已发送字节
  int64 total = 3;  // 文件总大小
}

// ==========================================
// 19. 图片缩略图（响应复用 DownloadFileResponse，content 为 JPEG 缩略图）
// ==========================================
message FileThumbRequest {
  string file_id = 1 [(validate.rules).string = {min_len: 1}];
}
