syntax = "proto3";

package storage;
option go_package = ".proto/service";

import "file.proto" ;
import "user.proto" ;
import "base.proto" ;
import "bucket.proto" ;

service User {
  //注册
  rpc Register(RegisterReq) returns (Response) ;

  // 三种登录方式
  rpc LoginByAccount(LoginByAccountReq) returns (Response);  // 账号 手机 邮箱 的密码登录

  rpc LoginByPhoneSms(LoginByPhoneSmsReq) returns (Response);      // 手机号验证码登录

  rpc LoginByEmailSms(LoginByEmailSmsReq) returns (Response);          // 邮箱验证码登录

  // 发送验证码
  rpc SendVerificationCode(SendVerificationCodeReq) returns (Response);

  // 重置密码
  rpc ResetPassword(ResetPasswordReq) returns (Response);

  // 账号找回
  rpc FindAccount(FindAccountReq) returns (Response);
}

// 存储桶服务定义
service Bucket {
  // 创建桶
  rpc CreateBucket(CreateBucketRequest) returns (Response);
  // 获取桶列表
  rpc GetBucketList(BucketListRequest) returns (Response);
  // 获取桶详情
  rpc GetBucketInfo(BucketInfoRequest) returns (Response);
  // 更新桶
  rpc UpdateBucket(UpdateBucketRequest) returns (Response);
  // 删除桶
  rpc DeleteBucket(DeleteBucketRequest) returns (Response);
}

// 文件服务定义
service File {
  // ===== 基础操作 =====
  // 获取文件信息
  rpc GetFileInfo(FileInfoRequest) returns (Response);
  // 上传文件
  rpc UploadFile(UploadFileRequest) returns (Response);
  // 获取用户所有文件列表
  rpc GetFileList(FileListRequest) returns (Response);
  // 获取用户对应桶文件列表
  rpc GetBucketFileList(BucketFileListRequest) returns (Response);
  // 重命名文件
  rpc RenameFile(RenameFileRequest) returns (Response);
  // 删除文件
  rpc DeleteFile(DeleteFileRequest) returns (Response);
  // 下载文件
  rpc DownloadFile(DownloadFileRequest) returns (Response);
  // 复制文件
  rpc CopyFile(CopyFileRequest) returns (Response);

  // ===== 分片上传 =====
  // 初始化分片上传
  rpc InitMultipartUpload(InitMultipartUploadRequest) returns (Response);
  // 上传单个分片
  rpc UploadPart(UploadPartRequest) returns (Response);
  // 完成分片上传（合并）
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (Response);
  // 取消分片上传
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (Response);

  // ===== 文件分享 =====
  // 创建分享
  rpc CreateShare(CreateShareRequest) returns (Response);
  // 访问分享（匿名）
  rpc AccessShare(AccessShareRequest) returns (Response);
  // 分享下载（匿名）
  rpc DownloadByShare(DownloadByShareRequest) returns (Response);

  // 用量统计（需登录）
  rpc GetStorageStats(GetStorageStatsRequest) returns (Response);

  // 获取预签名下载 URL（需登录；本地驱动不支持返回 40005）
  rpc GetPresignedURL(GetPresignedURLRequest) returns (Response);

  // 我的分享列表（需登录）
  rpc GetMyShares(GetMySharesRequest) returns (Response);

  // 撤销分享（需登录，仅限本人分享）
  rpc RevokeShare(RevokeShareRequest) returns (Response);

  // 流式下载（server-streaming 分块传输，需登录）
  rpc DownloadStream(DownloadFileRequest) returns (stream DownloadChunk);

  // 图片缩略图（需登录；仅本地驱动生成）
  rpc GetFileThumb(FileThumbRequest) returns (Response);
}
