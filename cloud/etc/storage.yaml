Name: storage.rpc
ListenOn: 0.0.0.0:8081
Mode: dev
#Etcd:   先不开启etcd
#  Hosts:
#  - 127.0.0.1:2379
#  Key: storageclient.rpc

# MySQL 数据库配置
MySQL:
  # 数据库连接地址（IP:端口）
  Host: 127.0.0.1:3306
  # 数据库用户名
  User: "root"
  # 数据库密码（⚠ 生产环境必须修改，此为本地开发默认值）
  Password: "12345"
  # 数据库名称
  Database: "cloud"
  # 字符集（推荐 utf8mb4 支持emoji）
  Charset: utf8mb4
  # 最大打开连接数
  MaxOpenConns: 100
  # 最大空闲连接数
  MaxIdleConns: 20
  # 连接最大存活时间（秒）
  ConnMaxLifetime: 3600
  # 连接最大空闲时间（秒）
  ConnMaxIdleTime: 600
  # 是否开启调试模式（打印SQL）
  Debug: true
  # 时区设置
  Loc: Local

# Redis 缓存配置
RedisConf:
  Host: 127.0.0.1:6379
  Password: ""
  DB: 0
  PoolSize: 50

# 存储驱动配置
Storage:
  # 驱动类型：local（本地磁盘） | minio（P2 暂未实现）
  Driver: local
  # 单文件/单分片上传上限（字节），默认 104857600 = 100MB
  # MaxUploadSize: 104857600
  Local:
    # 本地存储根目录
    RootDir: ./cloud_storage

# 用户级 API 限流（缺省关闭；匿名按 IP、登录按用户；触发返回 HTTP 429）
RateLimit:
  Enabled: true
  # QPS: 10
  # Burst: 20
  # SendCodeEvery: 20

# JWT 鉴权配置
JWT:
  # 签名密钥（⚠ 生产环境必须更换为足够长的随机字符串，此为开发演示值）
  Secret: www.topgoer.com
  # 过期时间（秒），默认 604800 = 7 天
  Expire: 604800
  # 签发者
  Issuer: 127.0.0.1
